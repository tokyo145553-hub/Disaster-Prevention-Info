<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEB防災 総合情報システム</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Yu Gothic","Meiryo",sans-serif;
background:#0f172a;
color:#fff;
}

header{
height:60px;
background:#111827;
display:flex;
align-items:center;
justify-content:center;
font-size:24px;
font-weight:bold;
border-bottom:2px solid #1e293b;
}

#map{
height:50vh;
width:100%;
}

.container{
padding:10px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:10px;
}

.card{
background:#1e293b;
border-radius:12px;
padding:12px;
}

.card h2{
font-size:18px;
margin-bottom:10px;
padding-left:8px;
border-left:5px solid #3b82f6;
}

.list{
max-height:250px;
overflow-y:auto;
}

.item{
background:#334155;
padding:8px;
margin-bottom:6px;
border-radius:6px;
}

footer{
margin-top:10px;
padding:15px;
background:#111827;
text-align:center;
}
</style>
</head>
<body>

<header>
TEB防災 総合情報システム
</header>

<div id="map"></div>

<div class="container">

<div class="card">
<h2>緊急地震速報</h2>
<div id="eew" class="list">
<div class="item">現在発表されていません</div>
</div>
</div>

<div class="card">
<h2>地震情報</h2>
<div id="earthquake" class="list">
<div class="item">読み込み中...</div>
</div>
</div>

<div class="card">
<h2>津波情報</h2>
<div id="tsunami" class="list">
<div class="item">現在発表されていません</div>
</div>
</div>

<div class="card">
<h2>気象警報・注意報</h2>
<div id="weather" class="list">
<div class="item">読み込み中...</div>
</div>
</div>

<div class="card">
<h2>台風情報</h2>
<div id="typhoon" class="list">
<div class="item">取得待機中</div>
</div>
</div>

<div class="card">
<h2>火山情報</h2>
<div id="volcano" class="list">
<div class="item">取得待機中</div>
</div>
</div>

</div>

<footer>
© TEB防災
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([36.2,138.2],5);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap contributors"
}
).addTo(map);

async function loadEarthquake(){

try{

const res = await fetch(
"https://api.p2pquake.net/v2/history?codes=551&limit=20"
);

const data = await res.json();

const area = document.getElementById("earthquake");

area.innerHTML = "";

data.forEach(eq=>{

const item = document.createElement("div");

item.className = "item";

item.innerHTML = `
<b>${eq.earthquake.hypocenter.name}</b><br>
M${eq.earthquake.magnitude}
 深さ${eq.earthquake.depth}km<br>
最大震度 ${eq.earthquake.maxScale}
`;

area.appendChild(item);

});

}catch(err){

document.getElementById("earthquake").innerHTML =
'<div class="item">取得失敗</div>';

}

}

loadEarthquake();

setInterval(loadEarthquake,60000);

</script>

</body>
</html>
